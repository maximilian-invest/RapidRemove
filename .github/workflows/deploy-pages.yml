name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/intelligent-keller-hU1oQ"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Der statische Export (output: export) unterstützt keine Middleware. Die
      # Laufzeit-Weiterleitungen gibt es nur im Node-Betrieb (Railway); für den
      # Pages-Export wird die Datei daher entfernt.
      - name: Remove middleware (not supported by static export)
        run: rm -f src/middleware.ts
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_BASE_PATH: "/RapidRemove"
          # Browser-Key für die Google-Places-Profilsuche im Wizard.
          # Als GitHub-Secret hinterlegen (Settings → Secrets and variables →
          # Actions). Fehlt er, läuft der Wizard im Demo-Modus weiter.
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
